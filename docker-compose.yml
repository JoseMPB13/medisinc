services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisinc-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    networks:
      - medisinc-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medisinc-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    networks:
      - medisinc-net

networks:
  medisinc-net:
    driver: bridge
