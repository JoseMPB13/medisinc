name: MediSinc-IA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Test Suite (FastAPI + Pytest)
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      AES_SECRET_KEY: cb1dae7f0f79118be73d708fe368dd20
      HMAC_PEPPER_KEY: 18ef1a006cf598e79239f54edba0ba36
      AI_PROVIDER: gemini
      GEMINI_API_KEY: mock_gemini_key_for_tests
      SUPABASE_URL: https://mock.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: mock_service_role_key

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Automated Tests (CV01-CV20 + Admin)
        working-directory: ./backend
        run: |
          pytest tests/ -v --color=yes

  frontend-build:
    name: Frontend Build & Lint (React 18 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci || npm install

      - name: Build Production SPA Bundle
        working-directory: ./frontend
        run: |
          npm run build
